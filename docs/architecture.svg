<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 732" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#333"/>
    </marker>
    <style>
      .box{stroke-width:1.5;rx:6;}
      .title{font-size:12px;font-weight:600;fill:#333;}
      .t{font-size:11px;fill:#333;}
      .ts{font-size:9.5px;fill:#555;}
      .tb{font-size:10px;fill:#b85450;}
      .edge{fill:none;stroke:#666;stroke-width:1.4;marker-end:url(#a);}
      .edgeB{stroke:#1ba1e2;stroke-width:2.6;}
      .edgeP{stroke:#4a7ab5;stroke-dasharray:4 3;}
      .bd{fill:#fff;stroke:#555;stroke-width:1.1;}
      .bdt{font-size:8.5px;font-weight:600;fill:#333;text-anchor:middle;}
    </style>
  </defs>

  <!-- Row 1: client -->
  <rect class="box" x="490" y="18" width="180" height="46" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="title" x="580" y="36" text-anchor="middle">MCP client</text>
  <text class="ts" x="580" y="52" text-anchor="middle">Claude Code · Desktop · any MCP client</text>

  <!-- Row 2: server -->
  <rect class="box" x="40" y="96" width="1080" height="272" fill="#ffffff" stroke="#666"/>
  <text class="title" x="580" y="113" text-anchor="middle" font-size="14">unified-finance-mcp</text>
  <text class="ts" x="580" y="129" text-anchor="middle">23 unified tools (auto-routed) + 53 futu-opend-mcp tools (mounted) = 76</text>

  <!-- group: market data -->
  <rect x="60" y="140" width="470" height="210" fill="#f8f9fa" stroke="#999" rx="4"/>
  <text class="ts" x="72" y="154" font-weight="600">Market data (equity &amp; macro)</text>
  <rect class="box" x="72" y="162" width="132" height="46" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="138" y="181" text-anchor="middle">get_quote</text><text class="t" x="138" y="196" text-anchor="middle">get_history</text>
  <circle class="bd" cx="196" cy="170" r="6.5"/><text class="bdt" x="196" y="173">1</text>
  <rect class="box" x="72" y="216" width="132" height="62" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="138" y="233" text-anchor="middle">get_company_info</text><text class="t" x="138" y="248" text-anchor="middle">get_financial_report</text><text class="t" x="138" y="263" text-anchor="middle">get_ownership</text>
  <circle class="bd" cx="196" cy="224" r="6.5"/><text class="bdt" x="196" y="227">2</text>
  <rect class="box" x="216" y="162" width="132" height="46" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="282" y="181" text-anchor="middle">run_screener</text><text class="t" x="282" y="196" text-anchor="middle">get_technical_indicators</text>
  <circle class="bd" cx="340" cy="170" r="6.5"/><text class="bdt" x="340" y="173">3</text>
  <rect class="box" x="216" y="216" width="132" height="46" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="282" y="235" text-anchor="middle">get_events_calendar</text><text class="t" x="282" y="250" text-anchor="middle">search_symbols</text>
  <circle class="bd" cx="340" cy="224" r="6.5"/><text class="bdt" x="340" y="227">4</text>
  <rect class="box" x="360" y="162" width="150" height="34" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="435" y="183" text-anchor="middle">get_economic_data</text>
  <circle class="bd" cx="502" cy="170" r="6.5"/><text class="bdt" x="502" y="173">5</text>
  <rect x="360" y="204" width="150" height="102" fill="#f0f0f0" stroke="#bbb" rx="4"/>
  <text class="ts" x="435" y="218" text-anchor="middle" font-weight="600">containers</text>
  <text class="ts" x="435" y="232" text-anchor="middle">quant_backtest (help)</text>
  <text class="ts" x="435" y="246" text-anchor="middle">kimi_datasource (list…call)</text>
  <text class="ts" x="435" y="260" text-anchor="middle">get_company_risk_cn</text>
  <text class="ts" x="435" y="272" text-anchor="middle">tv_scan · tv_analyze · egx</text>
  <text class="ts" x="435" y="285" text-anchor="middle">opt_chain · short_int · analyst_est</text>
  <text class="ts" x="435" y="298" text-anchor="middle">div_split_hist · earn_hist</text>
  <circle class="bd" cx="502" cy="212" r="6.5"/><text class="bdt" x="502" y="215">6</text>

  <!-- group: news -->
  <rect x="550" y="140" width="250" height="210" fill="#f8f9fa" stroke="#999" rx="4"/>
  <text class="ts" x="562" y="154" font-weight="600">News</text>
  <rect class="box" x="580" y="162" width="190" height="34" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="title" x="675" y="184" text-anchor="middle">get_news</text>
  <circle class="bd" cx="762" cy="170" r="6.5"/><text class="bdt" x="762" y="173">7</text>
  <text class="tb" x="675" y="215" text-anchor="middle">FMP excluded: free keys paywall all</text>
  <text class="tb" x="675" y="228" text-anchor="middle">news endpoints (HTTP 402) — chain skips it</text>
  <text class="ts" x="675" y="252" text-anchor="middle" fill="#23445d">Chinese 快讯 / flash headlines (热度,</text>
  <text class="ts" x="675" y="265" text-anchor="middle" fill="#23445d">view_count, no summary/sentiment)</text>
  <text class="ts" x="675" y="278" text-anchor="middle" fill="#23445d">→ futu-mounted search_news instead</text>
  <text class="ts" x="58" y="346" fill="#888" font-style="italic">get_service_status (read-only) also present; omitted from arrows for clarity</text>

  <!-- group: futu mount -->
  <rect x="820" y="140" width="280" height="210" fill="#f8f9fa" stroke="#999" rx="4"/>
  <text class="ts" x="918" y="154" font-weight="600">futu-opend-mcp mount (53 tools)</text>
  <rect class="box" x="840" y="164" width="260" height="128" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="t" x="970" y="182" text-anchor="middle">get_snapshot · get_kline</text>
  <text class="t" x="970" y="197" text-anchor="middle">futu_get_option_chain</text>
  <text class="t" x="970" y="212" text-anchor="middle">get_capital_flow · search_news</text>
  <text class="t" x="970" y="227" text-anchor="middle">plate/sector lists · history kline</text>
  <text class="t" x="970" y="242" text-anchor="middle">flow snapshot · fundamental static</text>
  <text class="t" x="970" y="257" text-anchor="middle">… (53 tools total)</text>
  <text class="ts" x="970" y="280" text-anchor="middle" fill="#23445d">HK/CN/US depth, attached to Futu OpenD</text>
  <circle class="bd" cx="1092" cy="174" r="6.5"/><text class="bdt" x="1092" y="177">8</text>

  <!-- router -->
  <rect class="box" x="110" y="392" width="940" height="46" fill="#1ba1e2" stroke="#006EAF" rx="23"/>
  <text class="title" x="580" y="413" text-anchor="middle" fill="#fff">market-aware auto-router</text>
  <text class="ts" x="580" y="428" text-anchor="middle" fill="#eaf7ff">source=auto: pick providers the market covers, try in chain order, first non-not_found wins · badges 1–8 = chains below</text>

  <!-- row 4: providers -->
  <rect class="box" x="40" y="500" width="148" height="60" fill="#f5f5f5" stroke="#666"/>
  <text class="t" x="114" y="518" text-anchor="middle">Yahoo Finance</text>
  <text class="ts" x="114" y="532" text-anchor="middle">in-process (yfinance)</text>
  <text class="ts" x="114" y="546" text-anchor="middle">no key</text>
  <rect class="box" x="208" y="500" width="148" height="60" fill="#f5f5f5" stroke="#666"/>
  <text class="t" x="282" y="518" text-anchor="middle">TradingView</text>
  <text class="ts" x="282" y="532" text-anchor="middle">in-process (screener + ta)</text>
  <text class="ts" x="282" y="546" text-anchor="middle">no key</text>
  <rect class="box" x="376" y="500" width="148" height="60" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="450" y="518" text-anchor="middle">FMP</text>
  <text class="ts" x="450" y="532" text-anchor="middle">direct or rotator</text>
  <text class="ts" x="450" y="546" text-anchor="middle">API key</text>
  <rect class="box" x="544" y="500" width="148" height="60" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="618" y="518" text-anchor="middle">Alpha Vantage</text>
  <text class="ts" x="618" y="532" text-anchor="middle">direct or rotator</text>
  <text class="ts" x="618" y="546" text-anchor="middle">API key</text>
  <rect class="box" x="712" y="500" width="148" height="60" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="786" y="518" text-anchor="middle">marketaux</text>
  <text class="ts" x="786" y="532" text-anchor="middle">direct or rotator</text>
  <text class="ts" x="786" y="546" text-anchor="middle">API token</text>
  <rect class="box" x="880" y="500" width="150" height="74" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="t" x="955" y="516" text-anchor="middle">Futu OpenD</text>
  <text class="ts" x="955" y="530" text-anchor="middle">via futu-opend-mcp</text>
  <text class="ts" x="955" y="544" text-anchor="middle">FUTU_OPEND_*</text>
  <text class="ts" x="955" y="558" text-anchor="middle">RSA unlock</text>
  <rect class="box" x="1050" y="500" width="110" height="74" fill="#e1d5e7" stroke="#9673a6"/>
  <text class="t" x="1105" y="514" text-anchor="middle">kimi → cliproxy</text>
  <text class="ts" x="1105" y="528" text-anchor="middle">kimi-tools proxy</text>
  <text class="ts" x="1105" y="542" text-anchor="middle">(KIMI_PROXY_URL)</text>
  <text class="ts" x="1105" y="556" text-anchor="middle">→ Kimi datasource</text>

  <!-- edges client -> server -->
  <line class="edge edgeB" x1="580" y1="64" x2="580" y2="92"/>
  <text class="ts" x="596" y="82">stdio · HTTP</text>

  <!-- edges: tools -> router (solid gray = tool wiring) -->
  <path class="edge" d="M138 208 Q138 390 250 390"/>
  <path class="edge" d="M138 278 Q138 390 300 390"/>
  <path class="edge" d="M282 208 Q282 390 350 390"/>
  <path class="edge" d="M282 262 Q282 390 390 390"/>
  <path class="edge" d="M435 196 Q435 390 430 390"/>
  <path class="edge" d="M435 278 Q435 390 470 390"/>
  <path class="edge" d="M675 350 Q675 390 600 390"/>

  <!-- edges router -> providers (blue = routed calls) -->
  <path class="edge edgeB" d="M160 438 Q160 500 114 500"/>
  <path class="edge edgeB" d="M320 438 Q320 500 282 500"/>
  <path class="edge edgeB" d="M480 438 Q480 500 450 500"/>
  <path class="edge edgeB" d="M640 438 Q640 500 618 500"/>
  <path class="edge edgeB" d="M800 438 Q800 500 786 500"/>
  <path class="edge edgeB" d="M930 438 Q930 500 905 500"/>
  <path class="edge edgeB" d="M1010 438 Q1010 500 1070 500"/>

  <!-- futu mount: 53 tools attach to OpenD directly (bypass router) -->
  <path class="edge edgeP" d="M1100 264 L1142 264 L1142 484 L960 484 Q950 484 950 494"/>

  <!-- routing chains legend -->
  <text class="ts" x="40" y="616" font-style="italic" fill="#888">Routing order (source=auto) — first non-not_found wins; numbers match badges on the tool boxes</text>
  <circle class="bd" cx="52" cy="631" r="6.5"/><text class="bdt" x="52" y="634">1</text>
  <text class="ts" x="66" y="634">quote / history — futu → yahoo → fmp → av</text>
  <circle class="bd" cx="52" cy="647" r="6.5"/><text class="bdt" x="52" y="650">2</text>
  <text class="ts" x="66" y="650">info yahoo→fmp→av · report fmp→yahoo→av · ownership yahoo→fmp</text>
  <circle class="bd" cx="52" cy="663" r="6.5"/><text class="bdt" x="52" y="666">3</text>
  <text class="ts" x="66" y="666">screener tradingview→fmp · technicals tradingview</text>
  <circle class="bd" cx="52" cy="679" r="6.5"/><text class="bdt" x="52" y="682">4</text>
  <text class="ts" x="66" y="682">calendar fmp→av · search fmp→av→yahoo</text>
  <circle class="bd" cx="632" cy="631" r="6.5"/><text class="bdt" x="632" y="634">5</text>
  <text class="ts" x="646" y="634">economic kimi→av</text>
  <circle class="bd" cx="632" cy="647" r="6.5"/><text class="bdt" x="632" y="650">6</text>
  <text class="ts" x="646" y="650">containers — quant_backtest · kimi_datasource · risk_cn · tv_scan · tv_analyze · egx</text>
  <text class="ts" x="646" y="660">opt_chain · short_int · analyst_est · div_split_hist · earn_hist</text>
  <circle class="bd" cx="632" cy="663" r="6.5"/><text class="bdt" x="632" y="666">7</text>
  <text class="ts" x="646" y="666">news — symbol av→yahoo→marketaux · global marketaux</text>
  <circle class="bd" cx="632" cy="679" r="6.5"/><text class="bdt" x="632" y="682">8</text>
  <text class="ts" x="646" y="682">futu mount 53 → OpenD direct (dashed) · failover via router→OpenD (blue)</text>

  <!-- style legend -->
  <line class="edge edgeB" x1="60" y1="706" x2="100" y2="706"/><text class="ts" x="110" y="710">solid = tool wiring / routed calls</text>
  <line class="edge edgeP" x1="380" y1="706" x2="420" y2="706"/><text class="ts" x="430" y="710">dashed = direct attachment (mount → OpenD)</text>
  <rect x="40" y="714" width="12" height="12" fill="#d5e8d4" stroke="#82b366"/><text class="ts" x="58" y="724">market data</text>
  <rect x="140" y="714" width="12" height="12" fill="#ffe6cc" stroke="#d79b00"/><text class="ts" x="158" y="724">news</text>
  <rect x="210" y="714" width="12" height="12" fill="#dae8fc" stroke="#6c8ebf"/><text class="ts" x="228" y="724">futu mount</text>
  <rect x="300" y="714" width="12" height="12" fill="#e1d5e7" stroke="#9673a6"/><text class="ts" x="318" y="724">kimi (credential proxy)</text>
</svg>
