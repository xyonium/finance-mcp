name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        # NOTE: trusted publishing (pending publisher) must be configured for the
        # `unified-finance-mcp` project name before the first tag is pushed:
        # https://pypi.org/manage/project/unified-finance-mcp/publishing/
        # (add this repo/workflow as a pending publisher, or the upload 403s)
